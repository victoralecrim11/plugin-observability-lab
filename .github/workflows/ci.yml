name: CI - Claude Code and Codex
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security scan and offline tests
        run: npm run check
      - name: Generate release distributions
        run: npm run build
      - name: Verify published Codex package is reproducible
        run: node scripts/verify-generated.mjs
      - name: Install pinned Codex runtime for catalog regression
        run: npm install --global @openai/codex@0.166.0
      - name: Verify real plugin and skill catalogs in an isolated profile
        run: node scripts/test-runtime-local.mjs
      - name: Verify bundled MCP in an isolated real runtime
        run: node scripts/test-mcp-runtime.mjs
      - name: Validate isolated Codex package
        working-directory: dist/codex/observability
        run: npm run check
      - name: Validate generated Claude/Codex package
        run: |
          node scripts/security-scan.mjs --path dist/claude-codex/observability
          node scripts/validate-package.mjs --path dist/claude-codex/observability
      - name: Validate generated adapter package
        run: |
          node scripts/security-scan.mjs --path dist/antigravity/observability
          node scripts/validate-package.mjs --path dist/antigravity/observability
      - name: Run generated Claude and Codex regression tests
        working-directory: dist/claude-codex/observability
        run: npm run check
      - name: Run generated Antigravity regression tests
        working-directory: dist/antigravity/observability
        run: npm run check
      - name: Publish validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: observability-distributions-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
